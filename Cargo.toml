[package]
name = "localsend-dispatcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
homepage = "https://xn--gckvb8fzb.com"
description = "LocalSend Dispatcher: A non-interactive command line client for LocalSend"
license-file = "LICENSE"
repository = "ssh://tty@tty.fail/mrus/lsd.git"
readme = "README.md"
keywords = ["localsend", "file-transfer", "cli", "lan", "p2p"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[[bin]]
name = "lsd"
path = "src/main.rs"

[dependencies]
localsend = { path = "vendor/localsend/packages/core", features = ["full"] }
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6.0"
futures-util = "0.3"
gethostname = "1.0"
mime_guess = "2.0"
pem = "4.0"
rcgen = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
doc_markdown = "allow"
